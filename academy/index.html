<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulateur PMO — H TECH ACADEMY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --ink:#18222F; --muted:#5A6572; --rule:#D9DFE3; --soft:#EBEFF1;
  --good:#2F7A4F; --bad:#B04A3A; --warn:#A8761F;
  --d1:#2E7D7A; --d2:#B07C2A; --d3:#6E4C8E; --d4:#3C6AA6; --d5:#5C7F36; --d6:#A4513F;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A21; --surface:#1C242D; --ink:#E7ECEF; --muted:#A3AEB8; --rule:#323D48; --soft:#252F39;
    --good:#5DBB84; --bad:#E07C6B; --warn:#D9A64E;
    --d1:#4FB3AE; --d2:#D9A54E; --d3:#A585C4; --d4:#6E9AD6; --d5:#8DB664; --d6:#D5806C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A21; --surface:#1C242D; --ink:#E7ECEF; --muted:#A3AEB8; --rule:#323D48; --soft:#252F39;
  --good:#5DBB84; --bad:#E07C6B; --warn:#D9A64E;
  --d1:#4FB3AE; --d2:#D9A54E; --d3:#A585C4; --d4:#6E9AD6; --d5:#8DB664; --d6:#D5806C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--d4);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:1.2rem;font-weight:600;margin-right:auto;letter-spacing:-.01em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--soft)}
main{padding:28px 0 64px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,4.6vw,3.1rem)}
h2{font-size:1.65rem}
h3{font-size:1.2rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.9rem}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:40px;align-items:center}
.ringbox{position:relative}
.ringbox svg{width:100%;height:auto;display:block}
.ring-seg{cursor:pointer;transition:stroke-width .2s}
.ring-seg:hover,.ring-seg:focus-visible{stroke-width:30}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.ring-center .big{font-family:var(--serif);font-size:3.2rem;font-weight:600;line-height:1}
.ring-center .lbl{font-size:.85rem;color:var(--muted);max-width:140px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0 26px}
.facts div{font-size:.9rem;color:var(--muted)}
.facts strong{display:block;font-family:var(--serif);font-size:1.6rem;color:var(--ink);font-weight:600}
.legend{list-style:none;padding:0;margin:32px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 28px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.legend button{background:none;border:0;padding:0;text-align:left;font-weight:500}
.sw{width:14px;height:14px;border-radius:3px}
.legend .pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* Guide */
.guide-layout{display:grid;grid-template-columns:240px 1fr;gap:36px}
.dlist{list-style:none;margin:0;padding:0;position:sticky;top:80px;align-self:start}
.dlist button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;color:var(--muted);font-size:.95rem}
.dlist button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
.dlist .rn{font-family:var(--serif);font-weight:600;color:var(--c);min-width:22px}
.dhead{border-left:4px solid var(--c);padding-left:16px;margin-bottom:22px}
.dhead .w{font-size:.95rem;color:var(--muted);margin-top:6px}
.lead{font-family:var(--serif);font-size:1.18rem;line-height:1.6;max-width:68ch;margin:0 0 26px}
.task{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:12px}
.task h3{font-size:1.08rem;margin-bottom:8px;display:flex;gap:10px}
.task h3 .tn{color:var(--c);min-width:62px}
.task ul{margin:0;padding-left:20px;color:var(--muted);font-size:.95rem}
.task li{margin:3px 0}
.reflex{margin-top:26px;padding:18px 20px;border-radius:10px;background:var(--soft)}
.reflex h3{margin-bottom:10px}
.reflex ul{margin:0;padding-left:20px}
.reflex li{margin:6px 0}

/* Setup */
.setup{max-width:760px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;margin:18px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--rule);background:var(--paper);padding:7px 12px;border-radius:999px;font-size:.92rem;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:var(--surface);box-shadow:inset 0 0 0 1px var(--c,var(--ink));font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.options-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.opt-card{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--paper);text-align:left}
.opt-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.opt-card strong{display:block;font-size:1.02rem}
.opt-card span{font-size:.88rem;color:var(--muted)}

/* Question runner */
.runbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.runbar .count{font-weight:600;font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:600;padding:5px 10px;border-radius:6px;background:var(--soft)}
.timer.low{color:var(--bad)}
.progress{flex:1;min-width:120px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink)}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:26px 28px;max-width:820px}
.qmeta{font-size:.88rem;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qmeta .tag{color:var(--c);font-weight:600}
.qtext{font-family:var(--serif);font-size:1.22rem;line-height:1.55;margin:0 0 8px;max-width:66ch}
.qhint{font-size:.9rem;font-weight:600;color:var(--warn);margin-bottom:12px}
.choices{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:1px solid var(--rule);border-radius:9px;padding:12px 14px;background:var(--paper)}
.choice .key{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:.82rem;font-weight:600;color:var(--muted)}
.choice.multi .key{border-radius:5px}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.choice[aria-pressed="true"] .key{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choice.ok{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.choice.ok .key{background:var(--good);border-color:var(--good);color:#fff}
.choice.ko{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.choice.ko .key{background:var(--bad);border-color:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.expl{margin-top:18px;padding:16px 18px;border-radius:9px;background:var(--soft);font-size:.97rem}
.expl strong{display:block;margin-bottom:4px}
.expl.good strong{color:var(--good)} .expl.bad strong{color:var(--bad)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.qnav .spacer{flex:1}
.flag[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:18px;max-width:820px}
.grid-nav button{height:36px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid-nav button.ans{background:var(--soft);font-weight:600}
.grid-nav button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid-nav button.fl{border-color:var(--warn);color:var(--warn)}

/* Results */
.score-head{display:flex;gap:36px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.score-big{font-family:var(--serif);font-size:4.4rem;font-weight:600;line-height:1}
.band{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:600;font-size:.92rem;margin-top:6px}
.bars{display:grid;gap:14px;margin:24px 0;max-width:760px}
.bar-row{display:grid;grid-template-columns:minmax(150px,280px) 1fr 70px;gap:14px;align-items:center;font-size:.95rem}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.review-item{border-top:1px solid var(--rule);padding:18px 0}
.review-item .qtext{font-size:1.06rem}
.review-item ul{list-style:none;padding:0;margin:10px 0}
.review-item li{padding:6px 10px;border-radius:6px;font-size:.95rem;margin:3px 0}
.review-item li.r{background:color-mix(in srgb,var(--good) 14%,transparent)}
.review-item li.w{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.hist{width:100%;border-collapse:collapse;font-size:.93rem}
.hist th,.hist td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule)}
.hist th{color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.empty{padding:28px;border:1px dashed var(--rule);border-radius:12px;color:var(--muted);max-width:640px}
.note{font-size:.86rem;color:var(--muted);max-width:70ch}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:grid;place-items:center;z-index:20;padding:20px}
.modal{background:var(--surface);border-radius:12px;padding:24px;max-width:460px;width:100%;border:1px solid var(--rule)}
.modal h3{margin-bottom:10px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:20px}
  .ringbox{max-width:320px;margin:0 auto}
  .guide-layout{grid-template-columns:1fr}
  .dlist{position:static;display:flex;overflow-x:auto;gap:4px}
  .dlist button{white-space:nowrap}
  .qcard{padding:20px}
  .bar-row{grid-template-columns:1fr 60px}
  .bar-row .bar{grid-column:1 / -1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Charte H TECH ACADEMY */
header.top{background:#0A2A66;border-bottom:3px solid #3F8A1E}
header.top .brand{color:#fff;display:flex;flex-direction:column;line-height:1.1}
header.top .brand small{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:#9FD27A;font-weight:700;text-transform:uppercase;margin-top:3px}
header.top nav.tabs button{color:#C9D6EC}
header.top nav.tabs button[aria-current="true"]{color:#fff;border-color:#9FD27A}
.btn{background:#0A2A66;border-color:#0A2A66;color:#fff}
.btn.ghost{background:transparent;color:#0A2A66;border-color:#0A2A66}
.sim-outils{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#C9D6EC;margin-left:auto}
.sim-outils a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:#C9D6EC;border-color:#C9D6EC}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Simulateur PMO<small>H TECH ACADEMY</small></div>
    <nav class="tabs" aria-label="Sections" style="display:none">
      <button data-go="home">Accueil</button>
      <button data-go="guide">Guide d’étude</button>
      <button data-go="practice">Entraînement</button>
      <button data-go="exam">Examen blanc</button>
      <button data-go="history">Résultats</button>
    </nav>
    <div class="sim-outils"><span id="sim-acces"></span><a href="en.html">English</a><a href="../#/espace">Mon espace</a></div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Référentiel PMO — H TECH ACADEMY */
const DOMAINS = [
 {id:1,name:"Développement et alignement organisationnels",short:"Alignement organisationnel",w:16,c:"var(--d1)",
  lead:"Le PMO agit au-delà de ses propres projets : il élève la gestion de projet organisationnelle (OPM). Compétences, culture, maturité et capacités se travaillent ensemble, toujours en partant d’une évaluation de l’existant.",
  tasks:[
   ["Améliorer la gestion de projet organisationnelle (OPM)",["Évaluer les compétences OPM actuelles dans toute l’organisation","Construire un cadre de compétences OPM sur mesure","Plans de développement individuels et d’équipe, formations ciblées par niveau","Programme de mentorat expérimentés / en développement","Intégrer les compétences OPM à la gestion des performances et aux carrières","Mettre à jour régulièrement le cadre de compétences"]],
   ["Façonner la culture de la gestion de projet organisationnelle",["Évaluer la culture actuelle et son alignement avec les principes OPM","Définir une vision et des valeurs qui soutiennent la culture projet","Faire porter les pratiques OPM par les dirigeants","Gestion du changement pour faciliter le changement culturel"]],
   ["Diriger la maturité de la gestion de projet organisationnelle",["Évaluer la maturité OPM avec des modèles établis","Feuille de route de maturité avec jalons et objectifs","KPI de progression de la maturité","Formations ciblées sur les écarts de maturité","Benchmark régulier avec les standards de l’industrie"]],
   ["Cultiver les capacités de gestion de projet organisationnelle",["Identifier et prioriser les capacités OPM clés","Écart entre capacités actuelles et état futur souhaité","Plan de développement : personnes, processus, technologie","Catégories de risques, coaching en servant leadership, adoption de la stratégie de risque"]]
  ],
  reflex:["Évaluer avant d’agir : la bonne première étape est presque toujours un diagnostic de l’existant.","Une culture change par l’exemple des dirigeants et la gestion du changement, pas par la sanction.","La maturité progresse par une feuille de route réaliste et mesurée, pas par décret.","Personnes, processus et technologie : traiter un seul des trois ne suffit pas."]},
 {id:2,name:"Éléments stratégiques du PMO",short:"Éléments stratégiques",w:18,c:"var(--d2)",
  lead:"Pourquoi ce PMO existe-t-il, jusqu’où va son autorité et comment les décisions sont-elles prises ? Stratégie, mandat et gouvernance forment le socle sans lequel les services n’ont pas de légitimité.",
  tasks:[
   ["Architecturer la stratégie du PMO",["Évaluer l’état actuel de la gestion de projet et les besoins","Définir vision, mission et objectifs stratégiques du PMO","Stratégie alignée sur les buts de l’organisation et ses points de douleur","Plan de gestion des risques propre au PMO","Feuille de route de mise en œuvre avec jalons","Plan de communication sur la valeur du PMO","Métriques de valeur et d’impact stratégique"]],
   ["Gérer le mandat du PMO",["Définir périmètre et autorité du PMO","Rôles et responsabilités vis-à-vis des projets et parties prenantes","Charte du PMO : but, objectifs, fonctions clés","Parrainage d’un cadre supérieur","Plan d’engagement des parties prenantes","Revue et mise à jour régulières du mandat"]],
   ["Établir et maintenir la gouvernance du PMO",["Cadre de gouvernance : surveillance et prise de décision","Structures de reporting et canaux de communication","Procédures d’escalade","Revues de gouvernance régulières et adaptation"]]
  ],
  reflex:["La stratégie du PMO découle de celle de l’organisation, pas des « bonnes pratiques » génériques.","Un conflit d’autorité révèle souvent un mandat ou une charte flous : on clarifie avec le sponsor.","Le PMO facilite et outille les décisions ; il ne se substitue pas aux instances de gouvernance.","Le mandat est vivant : un changement de direction ou de stratégie déclenche sa revue."]},
 {id:3,name:"Conception et structure du PMO",short:"Conception et structure",w:18,c:"var(--d3)",
  lead:"Le PMO est un fournisseur de services pour des clients internes. On identifie ces clients, on comprend leurs besoins, on formule une proposition de valeur et on conçoit des services standardisés mais adaptés.",
  tasks:[
   ["Gérer les clients potentiels et actuels du PMO",["Identifier et classer les clients","Personas clients pour comprendre besoins et attentes","Points de contact et retours réguliers avec les clients clés","Stratégie de promotion auprès des clients potentiels"]],
   ["Orchestrer des solutions pour répondre aux besoins des clients",["Enquêtes et entretiens réguliers","Approche systématique de collecte et d’analyse des attentes","Cadre de priorisation selon l’importance stratégique","Boucle de retour d’information pour améliorer les services"]],
   ["Articuler et faire évoluer la proposition de valeur du PMO",["Exprimer clairement bénéfices et valeur","Études de cas et histoires de réussite","Mesurer la contribution du PMO","Mettre à jour la proposition de valeur","Messages ciblés par groupe de clients","Amélioration continue de la livraison de valeur"]],
   ["Concevoir et mettre en œuvre les services du PMO",["Évaluation des besoins pour identifier les services requis","Offres sur mesure par groupe de clients","Processus standardisés pour chaque service","Catalogue de services et bénéfices","Cadre de SLA","Amélioration continue basée sur retours et performance"]]
  ],
  reflex:["Pensez « client » : la valeur du PMO est celle que ses clients perçoivent.","Un service naît d’un besoin évalué, pas d’une idée du PMO.","Standardiser le processus, adapter l’offre : les deux ne s’opposent pas.","Quand la demande dépasse la capacité, on priorise selon l’importance stratégique."]},
 {id:4,name:"Fonctionnement et performances du PMO",short:"Fonctionnement et performances",w:15,c:"var(--d4)",
  lead:"Concevoir ne suffit pas : il faut intégrer les clients aux services, les délivrer de façon fiable et disposer des bonnes ressources au bon moment.",
  tasks:[
   ["Intégration aux services du PMO",["Processus d’intégration structuré pour les nouveaux clients","Documentation et guides d’utilisation","Formation des clients aux services et processus","Support pendant l’intégration","Plan de communication pour les nouveaux services","Retours d’information pendant l’intégration"]],
   ["Gestion des services du PMO",["Déploiement progressif des services complexes ou à fort impact","Processus et flux de livraison clairs","Allocation des ressources","Contrôle qualité pour une livraison cohérente","Retours clients","Métriques d’efficacité","Escalade des problèmes de livraison"]],
   ["Gestion des ressources du PMO",["Plan de gestion des ressources aligné sur la demande","Matrice de compétences","Planification des capacités","Gestion des ressources externes et contractuelles"]]
  ],
  reflex:["Un service mal adopté manque souvent d’intégration : guides, formation, support, retours.","Fort impact = déploiement progressif (pilote, puis vagues).","Saturation de l’équipe : planification des capacités avant tout recrutement.","Qualité variable selon la personne : standardiser le processus et contrôler la qualité."]},
 {id:5,name:"Amélioration et efficacité du PMO",short:"Amélioration et efficacité",w:18,c:"var(--d5)",
  lead:"Mesurer pour améliorer : performance de chaque service, maturité des services, compétences de l’équipe PMO et, au final, la valeur que le PMO apporte à l’organisation.",
  tasks:[

function ringSVG(){
 const R=110,C=2*Math.PI*R,gap=1.2;let acc=0,out="";
 DOMAINS.forEach(d=>{
  const len=C*d.w/100-gap*2,off=-(C*acc/100)-gap;const m=mastery(d.id);const fill=m.pct===null?0:len*m.pct/100;
  out+=`<circle cx="140" cy="140" r="${R}" fill="none" stroke="${d.c}" stroke-opacity=".2" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${off}" transform="rotate(-90 140 140)" class="ring-seg" data-dom="${d.id}" tabindex="0" role="button" aria-label="Domaine ${roman[d.id-1]} : ${esc(d.name)}, ${d.w} %"><title>${esc(d.name)} — ${d.w} %</title></circle>`;
  if(fill>0)out+=`<circle cx="140" cy="140" r="${R}" fill="none" stroke="${d.c}" stroke-width="26" stroke-dasharray="${fill} ${C-fill}" stroke-dashoffset="${off}" transform="rotate(-90 140 140)" pointer-events="none"/>`;
  const mid=(acc+d.w/2)/100*2*Math.PI-Math.PI/2;const lx=140+(R+30)*Math.cos(mid),ly=140+(R+30)*Math.sin(mid);
  out+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="600" fill="${d.c}">${roman[d.id-1]}</text>`;
  acc+=d.w;});
 return `<svg viewBox="0 0 280 280" role="img" aria-label="Anneau des six domaines de l’examen, pondérés selon le référentiel">${out}</svg>`}

function pickExam(n){
 const quota=DOMAINS.map(d=>({d:d.id,n:Math.round(n*d.w/100)}));
 let sum=quota.reduce((a,b)=>a+b.n,0);let i=0;while(sum<n){quota[[1,2,4][i%3]].n++;sum++;i++}while(sum>n){quota[[0,3,5][i%3]].n--;sum--;i++}
 return shuffle(quota.flatMap(x=>shuffle(Q.filter(q=>q.d===x.d)).slice(0,x.n)))}

function startSession(mode,opts={}){
 let qs;
 if(mode==="practice"){qs=Q.filter(q=>pSel.has(q.d));if(opts.weak)qs=qs.filter(q=>store.last[q.id]===false);qs=shuffle(qs);if(pCount&&!opts.weak)qs=qs.slice(0,pCount);if(!qs.length)return;}
 else qs=eFormat==="mini"?pickExam(30):pickExam(Math.min(120,Q.length));
 session={mode,items:qs.map(q=>({q,order:shuffle(q.o.map((_,i)=>i)),sel:[],flag:false,checked:false})),i:0,start:Date.now(),
  limit:mode==="exam"?Math.round(qs.length*1.375*60):null,label:mode==="exam"?(eFormat==="mini"?"Mini-examen":"Examen complet"):"Entraînement"};
 clearInterval(timerId);
 if(session.limit){timerId=setInterval(tick,1000)}
 setView("run")}
function remaining(){return Math.max(0,session.limit-Math.floor((Date.now()-session.start)/1000))}
function tick(){if(!session||!session.limit)return;const r=remaining();const el=$("#timer");if(el){el.textContent=fmt(r);el.classList.toggle("low",r<300)}if(r<=0){clearInterval(timerId);finish()}}

 else if(a==="quit"){confirmQuit(()=>{clearInterval(timerId);setView(session.mode)})}
});
